[package]
name = "link-helm-desktop"
version = "1.0.0"
edition = "2021"
description = "Link Helm cross-browser identity router desktop shell"
license.workspace = true

[lib]
name = "link_helm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

router-model = { path = "../../../crates/router-model" }
router-core = { path = "../../../crates/router-core" }
browser-adapters = { path = "../../../crates/browser-adapters" }
platform-api = { path = "../../../crates/platform-api" }
config-store = { path = "../../../crates/config-store" }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../../../crates/platform-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
platform-windows = { path = "../../../crates/platform-windows" }
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../../../crates/platform-linux" }
tauri-plugin-single-instance = "2.4.3"
