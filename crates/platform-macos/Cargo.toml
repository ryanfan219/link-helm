[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
router-model.workspace = true
platform-api.workspace = true
serde.workspace = true
serde_json.workspace = true
core-foundation = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "block2", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSURL"] }
